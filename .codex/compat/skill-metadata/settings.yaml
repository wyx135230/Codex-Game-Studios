name: settings
description: "View or change project config — effective merged values, or set locally in project.local.yaml."
argument-hint: "[key | key=value | --local key=value]"
user-invocable: true
allowed-tools: Read, Glob, Grep, Write, Edit, AskUserQuestion, Bash(bash "*/.agents/skills/settings/../../hooks/yaml-helper.sh" resolve_setting *), Bash(bash "*/.agents/skills/settings/../../hooks/yaml-helper.sh" get_yaml_key *), Bash(bash "*/.agents/skills/settings/../../hooks/yaml-helper.sh" validate_yaml_enum *), Bash(bash "*/.agents/skills/settings/../../hooks/yaml-helper.sh" validate_enum_value *), Bash(bash "*/.agents/skills/settings/../../hooks/yaml-helper.sh" is_locally_overridable *), Bash(bash .codex/scripts/config-set.sh *), Bash(grep -B14 '^> ### RESERVED' .codex/docs/effects-map.md), Bash(grep -E '^## ')
model: sonnet
