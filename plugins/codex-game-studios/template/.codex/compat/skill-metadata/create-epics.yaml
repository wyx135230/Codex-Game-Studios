name: create-epics
description: "Turns the GDDs and architecture into epics, one per architectural module. Use when the user wants to break the game into epics or plan the work before writing stories. Not for splitting one epic into stories."
argument-hint: "[system-name | layer: foundation|core|feature|presentation | all] [--review full|lean|solo]"
user-invocable: true
allowed-tools: Read, Glob, Grep, Write, Edit, Agent, AskUserQuestion, Bash(bash "*/.agents/skills/create-epics/../../hooks/yaml-helper.sh" resolve_config *), Bash(bash .codex/scripts/gdd-structure-check.sh*), Bash(bash .codex/scripts/adr-status.sh*), Bash(bash .codex/scripts/md-section.sh *), Bash(bash .codex/scripts/write-guard.sh overwrite *)
model: sonnet
