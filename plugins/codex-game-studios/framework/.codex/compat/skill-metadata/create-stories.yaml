name: create-stories
description: "Breaks one epic into implementable stories with acceptance criteria. Use when the user wants stories for an epic or the next batch of work to build. Not for turning the whole design into epics."
argument-hint: "[epic-slug | epic-path] [--review full|lean|solo]"
user-invocable: true
allowed-tools: Read, Glob, Grep, Write, Edit, Agent, AskUserQuestion, Bash(bash "*/.agents/skills/create-stories/../../hooks/yaml-helper.sh" resolve_config *), Bash(bash .codex/scripts/adr-status.sh *), Bash(bash .codex/scripts/md-section.sh extract *), Bash(bash .codex/scripts/md-section.sh list *)
model: sonnet
