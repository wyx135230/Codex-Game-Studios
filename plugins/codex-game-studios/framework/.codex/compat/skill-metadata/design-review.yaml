name: design-review
description: "Reviews one design document for completeness, internal consistency, implementability, and design standards. Before handing to programmers."
argument-hint: "[path-to-design-doc] [--review full|lean|solo]"
user-invocable: true
allowed-tools: Read, Glob, Grep, Write, Edit, Agent, AskUserQuestion, Bash(bash "*/.agents/skills/design-review/../../hooks/yaml-helper.sh" resolve_config *), Bash(bash .codex/scripts/review-receipts.sh check *), Bash(bash .codex/scripts/review-receipts.sh hash *), Bash(bash .codex/scripts/gdd-structure-check.sh *), Bash(grep -E '^  - name:' design/registry/entities.yaml), Bash(grep -n -i -E *)
model: sonnet
