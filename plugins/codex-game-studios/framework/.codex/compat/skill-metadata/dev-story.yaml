name: dev-story
description: "Implements one story in code with tests, following its ADRs. Use when the user says to build, implement or start working on a story. Not for checking readiness beforehand or closing the story after."
argument-hint: "[story-path]"
user-invocable: true
disable-model-invocation: true
allowed-tools: Read, Glob, Grep, Write, Edit, Agent, AskUserQuestion, Bash(bash "*/.agents/skills/dev-story/../../hooks/yaml-helper.sh" resolve_config *), Bash(bash .codex/scripts/story-facts.sh *), Bash(bash .codex/scripts/adr-status.sh *), Bash(bash .codex/scripts/md-section.sh *), Bash(bash .codex/scripts/session-state.sh *), Bash(bash .codex/scripts/review-receipts.sh hash *), Bash(godot *), Bash(mkdir -p production/qa/evidence/*)
model: sonnet
